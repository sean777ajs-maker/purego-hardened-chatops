name: PureGo Hardened ISO ChatOps

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: "ChatOps command to execute (e.g., /iso-build)"
        required: false
        default: "/iso-build"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  chatops:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       (startsWith(github.event.comment.body, '/iso-build') ||
        startsWith(github.event.comment.body, '/appliance-verify') ||
        startsWith(github.event.comment.body, '/help')))
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge ChatOps Command (🚀 Reaction)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Handle /help command
        if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/help')
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "### 🤖 PureGo Hardened Appliance ChatOps Commands",
              "| Command | Description |",
              "| :--- | :--- |",
              "| `/iso-build` | Compiles Pure-Go PID 1 `/init`, packs `initramfs.cpio.gz`, generates `PureGoHardened-Hybrid.iso` from scratch, boots in QEMU, verifies HTTP + TLS 1.3 (ECDSA P-256), and uploads the ISO artifact. |",
              "| `/appliance-verify` | Runs the full QEMU boot + TLS 1.3 handshake audit and posts the serial log. |",
              "| `/help` | Shows this command reference. |"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Checkout Repository
        if: "!(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/help'))"
        uses: actions/checkout@v4

      - name: Setup Go
        if: "!(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/help'))"
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install QEMU System x86_64
        if: "!(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/help'))"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 curl

      - name: Download Alpine Virt 3.20.0 ISO & Build PureGoHardened-Hybrid.iso
        if: "!(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/help'))"
        run: |
          set -e
          mkdir -p build
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-virt-3.20.0-x86_64.iso -o build/alpine-virt-3.20.0-x86_64.iso
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/init ./cmd/init/main.go
          go run ./cmd/mkcpio/main.go "$PWD/build"
          go run ./cmd/mkiso/main.go "$PWD/build"
          sha256sum build/PureGoHardened-Hybrid.iso | tee build/iso.sha256

      - name: Boot PureGoHardened-Hybrid.iso in QEMU & Verify Endpoints
        if: "!(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/help'))"
        run: |
          set -e
          qemu-system-x86_64 \
            -cdrom build/PureGoHardened-Hybrid.iso \
            -boot d \
            -m 256M \
            -display none \
            -serial file:build/serial_iso_boot.log \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:8088-10.0.2.15:80,hostfwd=tcp:127.0.0.1:8443-10.0.2.15:443 \
            -device e1000,netdev=net0 &
          QEMU_PID=$!

          for i in $(seq 1 20); do
            if curl -fsS --max-time 1 http://127.0.0.1:8088/health > build/http_health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          go run ./cmd/verify_tls13/main.go | tee build/tls13_verify.txt
          kill $QEMU_PID || true

      - name: Upload Bootable ISO Artifact
        if: "!(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/help'))"
        uses: actions/upload-artifact@v4
        with:
          name: PureGoHardened-Hybrid-ISO
          path: |
            build/PureGoHardened-Hybrid.iso
            build/iso.sha256
            build/serial_iso_boot.log

      - name: Post ChatOps Telemetry Report to Issue/PR
        if: github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/help')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = fs.readFileSync('build/iso.sha256', 'utf8').trim();
            const httpHealth = fs.readFileSync('build/http_health.json', 'utf8').trim();
            const tlsVerify = fs.readFileSync('build/tls13_verify.txt', 'utf8').trim();
            const serialLines = fs.readFileSync('build/serial_iso_boot.log', 'utf8').trim().split('\n').slice(-25).join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const report = [
              `### ✅ ChatOps Appliance Build & Verification Complete`,
              `Triggered by @${context.actor} via \`${context.payload.comment.body.trim()}\``,
              ``,
              `#### 📦 Artifact & Integrity`,
              `- **Download ISO Artifact:** [PureGoHardened-Hybrid-ISO (Run #${context.runId})](${runUrl})`,
              `- **SHA-256:** \`${sha}\``,
              ``,
              `#### 🌐 HTTP \`/health\` Endpoint`,
              `\`\`\`json`,
              httpHealth,
              `\`\`\``,
              ``,
              `#### 🔒 In-Memory TLS 1.3 (ECDSA P-256) Verification`,
              `\`\`\`text`,
              tlsVerify,
              `\`\`\``,
              ``,
              `#### 🖥️ QEMU Serial Console Tail (\`ttyS0\`)`,
              `\`\`\`text`,
              serialLines,
              `\`\`\``
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
