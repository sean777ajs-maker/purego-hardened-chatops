name: ChatOps 24/7 Cloud-Only Loop (PR #4 Unified)

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      command:
        description: ChatOps command
        required: false
        default: /status
        type: string
      issue_number:
        description: Issue or pull request number for the reply
        required: false
        default: '1'
        type: string
      run_iso_build:
        description: Run hosted ISO build and health verification
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write
  actions: read

env:
  CGO_ENABLED: '0'
  STOREFRONT_URL: ${{ vars.STOREFRONT_URL || 'https://vegasdiscountdepot.com/' }}
  CATALOG_URL: ${{ vars.CATALOG_URL || 'https://vegasdiscountdepot.com/catalog.json' }}
  LINKEDIN_STATE: ${{ vars.LINKEDIN_STATE }}
  INVESTMENT_STATE: ${{ vars.INVESTMENT_STATE }}

jobs:
  cloud-chatops:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve command
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.eventName === 'issue_comment'
              ? context.payload.comment.body
              : context.eventName === 'workflow_dispatch'
                ? (context.payload.inputs.command || '/status') : '/status';
            const command = (body || '').trim().split(/\s+/)[0].toLowerCase();
            const issue = context.eventName === 'issue_comment'
              ? String(context.payload.issue.number)
              : context.eventName === 'workflow_dispatch'
                ? (context.payload.inputs.issue_number || '1') : '1';
            if (!/^[1-9]\d*$/.test(issue) || !Number.isSafeInteger(Number(issue))) {
              throw new Error('issue_number must be a positive issue number');
            }
            const supported = ['/status', '/catalog-count', '/lockdown-check', '/help',
              '/audit-muse', '/iso-build', '/token-status', '/watchdog-status',
              '/linkedin-status', '/linkedin-resume', '/sandbox-status', '/investment-status'];
            core.setOutput('name', supported.includes(command) ? command : '');
            core.setOutput('issue', issue);
      - uses: actions/checkout@v4
        if: steps.command.outputs.name != ''
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: steps.command.outputs.name != ''
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go build
        if: steps.command.outputs.name != ''
        id: build
        run: go build ./...
      - name: Vet Go packages
        if: steps.command.outputs.name != ''
        id: vet
        run: go vet ./...
      - name: Probe public services
        if: contains(fromJSON('["/status","/catalog-count","/lockdown-check","/sandbox-status"]'), steps.command.outputs.name)
        run: go run ./cmd/statusprobe -json "$RUNNER_TEMP/chatops-status.json"
      - name: Build and verify ISO on hosted runner
        if: steps.command.outputs.name != '' && (github.event_name != 'workflow_dispatch' || inputs.run_iso_build)
        id: iso
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          mkdir -p build
          base=https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64
          curl -fsSL "$base/alpine-virt-3.20.0-x86_64.iso" -o build/alpine-virt-3.20.0-x86_64.iso
          curl -fsSL "$base/alpine-virt-3.20.0-x86_64.iso.sha256" -o build/alpine.sha256
          (cd build && sha256sum -c alpine.sha256)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o build/init ./cmd/init
          go run ./cmd/mkcpio build
          go run ./cmd/mkiso build
          sha256sum build/purego-appliance.iso > build/iso.sha256
          qemu-system-x86_64 -m 512M -cdrom build/purego-appliance.iso \
            -display none -serial file:build/serial.log \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:8080-:80,hostfwd=tcp:127.0.0.1:8443-:443 \
            -device virtio-net-pci,netdev=net0 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health > build/health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat build/serial.log
            exit 1
          fi
          curl -kfsS --tlsv1.3 --tls-max 1.3 --max-time 5 https://127.0.0.1:8443/health > build/https-health.json
      - name: Upload ISO
        if: steps.iso.outcome == 'success'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: purego-appliance-iso
          path: |
            build/purego-appliance.iso
            build/iso.sha256
            build/health.json
            build/https-health.json
            build/serial.log
          if-no-files-found: error
      - name: Post command response
        if: always() && steps.command.outputs.name != '' && steps.command.outcome == 'success'
        uses: actions/github-script@v7
        env:
          COMMAND: ${{ steps.command.outputs.name }}
          ISSUE_NUMBER: ${{ steps.command.outputs.issue }}
          ISO_OUTCOME: ${{ steps.iso.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VET_OUTCOME: ${{ steps.vet.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const cmd = process.env.COMMAND;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            const isoStatus = process.env.ISO_OUTCOME === 'success'
              ? (process.env.ARTIFACT_OUTCOME === 'success' ? 'verified' : 'artifact upload failed')
              : (process.env.ISO_OUTCOME || 'skipped');
            const verification = `Build: ${process.env.BUILD_OUTCOME || 'skipped'} | Vet: ${process.env.VET_OUTCOME || 'skipped'} | ISO: ${isoStatus}`;
            let reply;
            let report;
            try { report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/chatops-status.json`, 'utf8')); } catch {}
            if (['/status', '/catalog-count', '/lockdown-check', '/sandbox-status'].includes(cmd)) {
              if (!report) {
                reply = `### Probe failed (${now})\nSee [workflow run](${runUrl}).`;
              } else if (cmd === '/catalog-count') {
                reply = `### Catalog count (${report.timestamp})\n${report.catalog.count === null ? 'Unavailable' : report.catalog.count} items (HTTP ${report.catalog.status}).`;
              } else if (cmd === '/lockdown-check') {
                const routes = report.lockdown.routes.map(r => `| ${r.url} | ${r.status || 'unavailable'} |`).join('\n');
                const holding = report.lockdown.routes.filter(r => r.status === 403 && !r.error).length;
                const breach = report.lockdown.routes.some(r => r.status !== 0 && r.status !== 403 && !r.error);
                const state = breach ? 'BREACH' : holding === report.lockdown.routes.length ? 'HOLDING' : 'UNVERIFIED (network or DNS error)';
                reply = `### Lockdown: ${state} (${report.timestamp})\n${holding}/8 routes returned HTTP 403.\n\n| Route | HTTP |\n|---|---|\n${routes}`;
              } else if (cmd === '/status') {
                if (context.eventName === 'schedule' && report.storefront.state === 'UP' && report.catalog.state === 'UP' && report.catalog.count !== null && report.lockdown.state === 'HOLDING' && isoStatus === 'verified') return;
                const breach = report.lockdown.routes.some(r => r.status !== 0 && r.status !== 403 && !r.error);
                const lockdown = breach ? 'BREACH' : report.lockdown.routes.every(r => r.status === 403 && !r.error) ? 'HOLDING' : 'UNVERIFIED (network or DNS error)';
                reply = `### Cloud status (${report.timestamp})\n- Storefront: ${report.storefront.state} (HTTP ${report.storefront.status})\n- Catalog: ${report.catalog.count === null ? 'unavailable' : report.catalog.count + ' items'}\n- Lockdown: ${lockdown}`;
              } else {
                reply = `### Sandbox status (${report.timestamp})\n- Runner: GitHub-hosted\n- Workflow permissions: contents read, issues write, actions read\n- Lockdown check: ${report.lockdown.routes.filter(r => r.status === 403 && !r.error).length}/8 verified`;
              }
            } else if (cmd === '/iso-build') {
              if (process.env.ISO_OUTCOME === 'success' && process.env.ARTIFACT_OUTCOME === 'success') {
                const sha = fs.readFileSync('build/iso.sha256', 'utf8').trim().split(/\s+/)[0];
                const health = fs.readFileSync('build/health.json', 'utf8').trim();
                reply = `### ISO build complete\n- SHA-256: \`${sha}\`\n- HTTP health: \`${health}\`\n- HTTPS TLS 1.3 health: \`${fs.readFileSync('build/https-health.json', 'utf8').trim()}\`\n- [Run and artifact](${runUrl})`;
              } else {
                reply = `### ISO build ${process.env.ISO_OUTCOME === 'skipped' ? 'skipped' : 'failed'}\nSee [workflow run](${runUrl}).`;
              }
            } else if (cmd === '/watchdog-status') {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'watchdog-probe.yml', per_page: 1 });
                const last = data.workflow_runs[0];
                reply = last ? `### Watchdog status\nLatest run: [${last.status}${last.conclusion ? ` / ${last.conclusion}` : ''}](${last.html_url}), started ${last.created_at}.` : '### Watchdog status\nNo runs found.';
              } catch (error) {
                reply = `### Watchdog status\nUnavailable: ${error.status || 'request failed'}.`;
              }
            } else if (cmd === '/token-status') {
              reply = '### Token status\nThis workflow requests contents read, issues write and actions read. External token status is not configured.';
            } else if (cmd === '/audit-muse') {
              try {
                const out = execFileSync('grep', ['-rnI', '-E', 'ssh-rsa|ssh-ed25519|authorized_keys|ngrok|cloudflared|socat|nc -e|/dev/tcp', '.', '--exclude-dir=.git', '--exclude=chatops-mobile.yml'], { encoding: 'utf8', maxBuffer: 1024 * 1024 });
                reply = `### Pattern audit\nMatches found:\n\`\`\`\n${out.slice(0, 1200)}\n\`\`\``;
              } catch (error) {
                reply = error.status === 1 ? '### Pattern audit\nNo matching patterns found. This is not a comprehensive security audit.' : '### Pattern audit\nScan failed.';
              }
            } else if (cmd === '/help') {
              reply = '### ChatOps commands\n`/status`, `/catalog-count`, `/lockdown-check`, `/audit-muse`, `/iso-build`, `/token-status`, `/watchdog-status`, `/linkedin-status`, `/linkedin-resume`, `/sandbox-status`, `/investment-status`. External LinkedIn and investment integrations are not configured.';
            } else if (cmd === '/linkedin-status' || cmd === '/linkedin-resume' || cmd === '/investment-status') {
              const configured = cmd === '/investment-status' ? process.env.INVESTMENT_STATE : process.env.LINKEDIN_STATE;
              const state = configured ? JSON.stringify(configured.slice(0, 200)).replace(/`/g, '\\u0060') : 'not configured';
              reply = `### ${cmd}\nConfigured state: \`${state}\` (not independently verified). No external state was checked or changed.`;
            } else {
              reply = `### ${cmd}\nNo live data source is configured; no external state was checked or changed.`;
            }
            reply += `\n\n- **Verification:** ${verification}\n- [Workflow run](${runUrl})`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.ISSUE_NUMBER), body: reply });
