name: PureGo Hardened Appliance ChatOps

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: 'ChatOps command (/iso-build, /appliance-verify, /help)'
        required: true
        default: '/iso-build'

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  chatops:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && startsWith(trim(github.event.comment.body), '/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Execute ChatOps Command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.inputs.command }}
        run: |
          CMD=$(echo "$COMMENT_BODY" | tr -d '\r' | awk '{print $1}')
          echo "Executing ChatOps command: $CMD"

          if [ "$CMD" = "/help" ]; then
            if [ -n "$ISSUE_NUM" ]; then
              gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body "### PureGo Hardened Appliance ChatOps Commands
          - \`/iso-build\` — Compile static Pure-Go PID 1 \`init\`, build concatenated \`initramfs.cpio.gz\`, and assemble bootable \`purego-appliance.iso\`.
          - \`/appliance-verify\` — Boot \`purego-appliance.iso\` inside headless QEMU and verify HTTP (\`:80\`) and In-Memory ECDSA P-256 TLS 1.3 (\`:443\`) \`/health\` endpoints.
          - \`/help\` — Display this command reference."
            fi
            exit 0
          fi

          if [ "$CMD" = "/iso-build" ] || [ "$CMD" = "/appliance-verify" ]; then
            mkdir -p build
            curl -sSL -o build/alpine-virt-3.20.0-x86_64.iso https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-virt-3.20.0-x86_64.iso
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/init ./cmd/init
            go run ./cmd/mkcpio build
            go run ./cmd/mkiso build
            ISO_SHA=$(sha256sum build/purego-appliance.iso | awk '{print $1}')
            INIT_SHA=$(sha256sum build/init | awk '{print $1}')

            if [ "$CMD" = "/appliance-verify" ]; then
              sudo apt-get update && sudo apt-get install -y qemu-system-x86
              qemu-system-x86_64 -m 512M -cdrom build/purego-appliance.iso -nographic -serial file:build/serial.log -net nic,model=e1000 -net user,hostfwd=tcp::8080-:80,hostfwd=tcp::8443-:443 &
              QEMU_PID=$!
              for i in $(seq 1 30); do
                if curl -sk https://127.0.0.1:8443/health > build/health.json 2>/dev/null; then
                  break
                fi
                sleep 2
              done
              kill $QEMU_PID || true
              HEALTH_OUT=$(cat build/health.json || echo '{"status":"timeout"}')
              if [ -n "$ISSUE_NUM" ]; then
                gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body "### ✅ \`/appliance-verify\` Complete
          - **ISO SHA-256:** \`$ISO_SHA\`
          - **TLS 1.3 \`/health\` Response:** \`$HEALTH_OUT\`
          - **Run URL:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              fi
            else
              if [ -n "$ISSUE_NUM" ]; then
                gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body "### ✅ \`/iso-build\` Complete
          - **PID 1 \`init\` SHA-256:** \`$INIT_SHA\`
          - **Bootable \`purego-appliance.iso\` SHA-256:** \`$ISO_SHA\`
          - **Download Artifact:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              fi
            fi
          fi

      - name: Upload Bootable ISO Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purego-appliance-iso
          path: build/purego-appliance.iso
          if-no-files-found: ignore
